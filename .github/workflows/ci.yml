name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  presentacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Genera los datos de la propuesta y revisa que el Home siga al día con las áreas
        run: python3 scripts/build_propuesta.py --estricto
      - name: Sintaxis de los módulos JS de la presentación
        run: |
          set -e
          for f in web/js/propuesta/*.js web/js/propuesta/modulos/*.js web/js/propuesta/piezas/*.js; do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs || { echo "error de sintaxis en $f"; exit 1; }
          done
      - name: La presentación no numera los capítulos
        run: |
          if grep -nE 'padStart\(2, ?.0.\)|class="num"|\$\{c\.n\}|\$\{i \+ 1\}\.' web/js/propuesta/main.js web/js/propuesta/modulos/*.js; then
            echo 'La presentación muestra el nombre del punto, no un número de 1 a 7'
            exit 1
          fi
  despliegue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: El arranque no deja las búsquedas en los registros ni anuncia el servidor
        run: |
          # El servicio de Railway arranca desde railpack.json de la raíz: sitio y panel en un solo proceso
          grep -qE '"startCommand": *"uvicorn servidor:app ' railpack.json || { echo 'railpack.json no arranca uvicorn servidor:app'; exit 1; }
          for f in admin/Procfile admin/railpack.json admin/railway.json; do
            grep -q 'uvicorn app\.main:app' "$f" || { echo "$f no arranca el panel con uvicorn"; exit 1; }
          done
          # Todo comando de arranque lleva --no-access-log (el log de acceso imprime la URL con ?q=: cédulas, teléfonos y
          # nombres buscados irían a los registros de Railway) y --no-server-header (uvicorn agrega «server: uvicorn»).
          # Un comando partido con «\» se junta con sus líneas siguientes y se revisa completo.
          awk '
            FNR == 1 { previo = "" }
            { l = $0; if (previo != "") sub(/^[ \t]+/, "", l) }
            l ~ /\\$/ { previo = previo substr(l, 1, length(l) - 1); next }
            { linea = previo l; previo = "" }
            linea ~ /uvicorn (app\.main|servidor):app/ {
              split("--no-access-log --no-server-header", ops, " ")
              for (i = 1; i <= 2; i++)
                if (linea !~ ("(^|[ \t])" ops[i] "([^-A-Za-z0-9]|$)")) { print FILENAME ": falta " ops[i] " en: " linea; mal = 1 }
            }
            END { exit mal }
          ' railpack.json README.md admin/Procfile admin/railpack.json admin/railway.json admin/README.md
      - name: El sitio se construye como en Railway y no carga scripts de otro dominio
        run: |
          python3 scripts/build_data.py && PANEL_URL=/panel/ python3 scripts/build_site.py
          # La CSP del sitio solo admite scripts propios (script-src 'self' y hashes de los scripts en línea): three y GSAP
          # van como copias locales. Cada archivo se lee entero (-z); \x27 es la comilla simple y \x60 la invertida.
          p='(?is)<script\b[^>]*\bsrc\s*=\s*["\x27]?(?:https?:)?//[^\s"\x27>]*'                        # <script src="http…"> o "//…"
          p+='|<script\b[^>]*\bimportmap\b[^>]*>(?:(?!</script>).)*?["\x27](?:https?:)?//[^\s"\x27]*'  # URL externas en un importmap
          p+='|<link\b(?=[^>]*\bmodulepreload\b)[^>]*\bhref\s*=\s*["\x27]?(?:https?:)?//[^\s"\x27>]*'  # modulepreload de otro dominio
          p+='|<script\b[^>]*>(?:(?!</script>).)*?\b(?:from|import)\s*\(?\s*["\x27\x60](?:https?:)?//[^\s"\x27\x60]*'  # import
          st=0
          grep -aPzoH "$p" site/*.html > "$RUNNER_TEMP/externos" || st=$?
          case $st in
            0) tr '\0' '\n' < "$RUNNER_TEMP/externos"
               echo 'El sitio no carga scripts de otro dominio: copia local en web/vendor/ y reescritura en build_site.py'
               exit 1 ;;
            1) echo 'site/*.html no carga scripts de otro dominio' ;;
            *) echo 'No se pudo revisar site/*.html'; exit 1 ;;
          esac
  panel:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements-dev.txt
      - name: Las dependencias del servicio único (requirements.txt de la raíz) son las del panel
        working-directory: .
        run: diff <(grep -v '^#' requirements.txt) <(grep -v '^#' admin/requirements.txt)
      - name: Playwright con Chromium (la prueba de la CSP del sitio con un navegador real)
        run: |
          npm i --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Pruebas del panel (datos inventados, MongoDB de servicio)
        run: python -m pytest -q tests
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      - name: Sintaxis de los módulos JS del panel
        run: |
          set -e
          for f in web/js/*.js web/js/vistas/*.js; do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs || { echo "error de sintaxis en $f"; exit 1; }
          done
      - name: Ningún Excel, CSV del panel ni .env en el repositorio
        working-directory: .
        run: |
          # Hojas de cálculo en cualquier carpeta, .env y .env.* (salvo .env.example), CSV en admin/ o en la raíz
          # y exportaciones del panel; sin distinguir mayúsculas. data/ sí versiona CSV públicos.
          if git ls-files | grep -iE '\.(xlsx|xlsm|xlsb|xls|ods)$|(^|/)\.env(\..*)?$|^(admin/.*|[^/]*)\.csv$|(^|/)(asistentes-[^/]*\.csv|base-unica-[^/]*)$' \
              | grep -viE '(^|/)\.env\.example$'; then
            echo 'El repositorio es público: no versiona datos personales ni credenciales'
            exit 1
          fi
