name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  presentacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Genera los datos de la propuesta y revisa que el Home siga al día con las áreas
        run: python3 scripts/build_propuesta.py --estricto
      - name: Sintaxis de los módulos JS de la presentación
        run: |
          set -e
          for f in web/js/propuesta/*.js web/js/propuesta/modulos/*.js web/js/propuesta/piezas/*.js; do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs || { echo "error de sintaxis en $f"; exit 1; }
          done
      - name: La presentación no numera los capítulos
        run: |
          if grep -nE 'padStart\(2, ?.0.\)|class="num"|\$\{c\.n\}|\$\{i \+ 1\}\.' web/js/propuesta/main.js web/js/propuesta/modulos/*.js; then
            echo 'La presentación muestra el nombre del punto, no un número de 1 a 7'
            exit 1
          fi
  panel:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements-dev.txt
      - name: Pruebas del panel (datos inventados, MongoDB de servicio)
        run: python -m pytest -q tests
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      - name: Sintaxis de los módulos JS del panel
        run: |
          set -e
          for f in web/js/*.js web/js/vistas/*.js; do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs || { echo "error de sintaxis en $f"; exit 1; }
          done
      - name: El arranque no deja las búsquedas en los registros (--no-access-log)
        run: |
          for f in Procfile railpack.json railway.json; do
            grep -q 'uvicorn app\.main:app' "$f" || { echo "$f no arranca el panel con uvicorn"; exit 1; }
          done
          # El log de acceso imprime la URL con ?q=: cédulas, teléfonos y nombres buscados irían a los registros de Railway
          if grep -n 'uvicorn app\.main:app' Procfile railpack.json railway.json README.md | grep -v -- '--no-access-log'; then
            echo 'Todo comando de arranque del panel lleva --no-access-log'
            exit 1
          fi
      - name: Ningún Excel, CSV del panel ni .env en el repositorio
        working-directory: .
        run: |
          # Hojas de cálculo en cualquier carpeta, .env y .env.* (salvo .env.example), CSV en admin/ o en la raíz
          # y exportaciones del panel; sin distinguir mayúsculas. data/ sí versiona CSV públicos.
          if git ls-files | grep -iE '\.(xlsx|xlsm|xlsb|xls|ods)$|(^|/)\.env(\..*)?$|^(admin/.*|[^/]*)\.csv$|(^|/)(asistentes-[^/]*\.csv|base-unica-[^/]*)$' \
              | grep -viE '(^|/)\.env\.example$'; then
            echo 'El repositorio es público: no versiona datos personales ni credenciales'
            exit 1
          fi
