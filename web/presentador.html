<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Presentador · taller</title>
<meta name="description" content="El presentador de la propuesta Yondó 2028–2031: la caricatura en 3D que explica lo que narra el asistente. Aquí se mueve y se prueba cada gesto.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2034%2030'%3E%3Cpath%20d='M4%202.5h26a2%202%200%200%201%202%202v14a2%202%200%200%201-2%202H14l-6%207v-7H4a2%202%200%200%201-2-2v-14a2%202%200%200%201%202-2z'%20fill='%23fff'%20stroke='%23e3141b'%20stroke-width='3'%20stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root { --bg: #f2f2ef; --surface: #ffffff; --ink: #141414; --muted: #5f5f5a; --line: #d9d8d2; --accent: #e3141b;
  --accent-ink: #ffffff; --piso: #e4e2db; --f-display: 'Anton', 'Arial Narrow', sans-serif; --f-body: 'Public Sans', system-ui, sans-serif; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #101010; --surface: #1b1b1b; --ink: #f2f2ef; --muted: #a3a39c; --line: #2e2e2c; --piso: #1d1d1c; }
}
:root[data-theme="dark"] { --bg: #101010; --surface: #1b1b1b; --ink: #f2f2ef; --muted: #a3a39c; --line: #2e2e2c; --piso: #1d1d1c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); }
body { display: grid; grid-template-rows: auto 1fr auto; min-height: 100dvh; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 14px 16px 6px; }
header h1 { margin: 0; font: 26px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.02em; }
header p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 70ch; }
.escenario { position: relative; min-height: 340px; }
.escenario canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.ayuda { position: absolute; left: 16px; bottom: 10px; margin: 0; font-size: 12.5px; color: var(--muted); pointer-events: none; }
.mandos { display: grid; gap: 10px; padding: 10px 16px 16px; background: var(--surface); border-top: 1px solid var(--line); }
.fila { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fila b { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-right: 4px; min-width: 70px; }
button, input { font: inherit; }
button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"], button.primario { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
input[type="text"] { flex: 1 1 260px; min-width: 0; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.dice { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); max-width: min(62ch, calc(100% - 32px)); margin: 0; padding: 10px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: inset 6px 0 0 var(--accent); font-size: 17px; }
.dice[hidden] { display: none; }
@media (max-width: 640px) { header h1 { font-size: 21px; } .fila b { flex-basis: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Presentador · taller</h1>
  <p>La caricatura que explica lo que narra el asistente en la presentación técnica. Gírela arrastrando, acérquela con la rueda, haga clic para que señale ese punto y muévala con las flechas.</p>
</header>
<main class="escenario" id="escenario">
  <p class="ayuda">← → camina · clic: señala ahí · arrastrar: girar la vista</p>
  <p class="dice" id="dice" role="status" hidden></p>
</main>
<section class="mandos" aria-label="Mandos del presentador">
  <div class="fila" role="group" aria-label="Gestos"><b>Gestos</b></div>
  <div class="fila" role="group" aria-label="Hablar">
    <b>Hablar</b>
    <input type="text" id="texto" value="¡Trabajemos juntos! Les explico la propuesta paso a paso." maxlength="220" aria-label="Lo que dice">
    <button type="button" class="primario" id="decir">Decir</button>
    <button type="button" id="mover-boca" aria-pressed="false">Mover la boca</button>
  </div>
  <div class="fila" role="group" aria-label="Escena">
    <b>Escena</b>
    <button type="button" id="entrar">Entrar</button>
    <button type="button" id="salir">Salir</button>
    <button type="button" id="izquierda">← Caminar</button>
    <button type="button" id="derecha">Caminar →</button>
    <button type="button" id="centro">Al centro</button>
  </div>
</section>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module" src="js/presentador/taller.js"></script>
</body>
</html>
